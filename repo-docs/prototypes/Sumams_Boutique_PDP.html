<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Royal Crimson Benarasi — Sumam's Boutique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500&family=Hind:wght@300;400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: #F5EFE6;
  color: #1C0A06;
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
  min-width: 1200px;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1C0A06; }
::-webkit-scrollbar-thumb { background: #8C6A55; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

/* ── TOKENS ── */
const C = {
  dark:   '#1C0A06',
  copper: '#BF5E18',
  ivory:  '#F5EFE6',
  gold:   '#D4880A',
  muted:  '#8C6A55',
  cream:  '#EDE3D6',
  whatsapp: '#25D366',
};
const F = {
  display: "'Cormorant Garamond', serif",
  ui:      "'DM Sans', sans-serif",
  bn:      "'Hind', sans-serif",
};
const PAD = 'clamp(40px, 6vw, 86px)';

/* ── SHARED ── */
function AlponaDivider() {
  return (
    <div style={{ display: 'flex', justifyContent: 'center', margin: '32px 0' }}>
      <svg width="320" height="24" viewBox="0 0 320 24" fill="none" style={{ opacity: 0.45 }}>
        <line x1="0" y1="12" x2="126" y2="12" stroke={C.copper} strokeWidth="0.75" />
        <polygon points="132,12 138,7 144,12 138,17" stroke={C.gold} strokeWidth="0.5" fill="none" />
        <ellipse cx="160" cy="6" rx="4" ry="8" stroke={C.copper} strokeWidth="0.5" fill="none" transform="rotate(0,160,12)" />
        <ellipse cx="160" cy="6" rx="4" ry="8" stroke={C.copper} strokeWidth="0.5" fill="none" transform="rotate(90,160,12)" />
        <ellipse cx="160" cy="6" rx="4" ry="8" stroke={C.copper} strokeWidth="0.5" fill="none" transform="rotate(180,160,12)" />
        <ellipse cx="160" cy="6" rx="4" ry="8" stroke={C.copper} strokeWidth="0.5" fill="none" transform="rotate(270,160,12)" />
        <circle cx="160" cy="12" r="1.5" stroke={C.gold} strokeWidth="0.5" fill="none" />
        <polygon points="176,12 182,7 188,12 182,17" stroke={C.gold} strokeWidth="0.5" fill="none" />
        <line x1="194" y1="12" x2="320" y2="12" stroke={C.copper} strokeWidth="0.75" />
      </svg>
    </div>
  );
}

function PhotoPlaceholder({ gradient, label, aspect = '3/4', style: extraStyle = {} }) {
  return (
    <div style={{
      position: 'relative',
      width: '100%',
      aspectRatio: aspect,
      background: gradient,
      overflow: 'hidden',
      flexShrink: 0,
      ...extraStyle,
    }}>
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        pointerEvents: 'none',
      }}>
        <div style={{
          border: '1px dashed rgba(245,239,230,0.22)',
          padding: '9px 16px',
          maxWidth: '78%',
        }}>
          <div style={{
            fontFamily: F.ui, fontSize: 9,
            letterSpacing: '0.12em', textTransform: 'uppercase',
            color: 'rgba(245,239,230,0.38)',
            textAlign: 'center', lineHeight: 1.6,
          }}>{label}</div>
        </div>
      </div>
    </div>
  );
}

/* ── MARGIN ANNOTATION ── */
function Note({ text, top = 0 }) {
  return (
    <div style={{
      position: 'absolute',
      right: -200,
      top,
      width: 180,
      fontFamily: F.ui,
      fontSize: 9,
      color: 'rgba(212,136,10,0.65)',
      lineHeight: 1.55,
      borderLeft: '1px solid rgba(212,136,10,0.25)',
      paddingLeft: 8,
    }}>{text}</div>
  );
}

/* ══════════════════════════════════════
   NAVBAR — identical to homepage
══════════════════════════════════════ */
function NavLink({ label }) {
  const [hov, setHov] = useState(false);
  return (
    <div onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        position: 'relative', cursor: 'pointer',
        fontFamily: F.ui, fontSize: 11, fontWeight: 400,
        letterSpacing: '0.18em', textTransform: 'uppercase',
        color: hov ? C.gold : 'rgba(245,239,230,0.70)',
        transition: 'color 0.25s', paddingBottom: 3, userSelect: 'none',
      }}>
      {label}
      <span style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, height: 1,
        background: C.gold,
        transform: hov ? 'scaleX(1)' : 'scaleX(0)',
        transformOrigin: 'left',
        transition: 'transform 0.25s ease',
      }} />
    </div>
  );
}

function Navbar() {
  return (
    <nav style={{
      position: 'sticky', top: 0, zIndex: 100,
      width: '100%', height: 64,
      background: C.dark,
      borderBottom: '1px solid rgba(212,136,10,0.18)',
      display: 'flex', alignItems: 'center',
      padding: `0 ${PAD}`,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 28, flex: 1 }}>
        {['SAREES','JEWELLERY','COLLECTIONS','STORY'].map(l => <NavLink key={l} label={l} />)}
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: '0 0 auto' }}>
        <img src="uploads/logo_transparent.png" alt="Sumam's Boutique"
          style={{ height: 44, width: 'auto', maxWidth: 160, objectFit: 'contain' }} />
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18, flex: 1, justifyContent: 'flex-end' }}>
        {/* Search */}
        <button style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', padding: 0 }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke={C.ivory} strokeWidth="1.25" strokeLinecap="round" style={{ opacity: 0.8 }}>
            <circle cx="7.5" cy="7.5" r="5" /><line x1="11.5" y1="11.5" x2="16" y2="16" />
          </svg>
        </button>
        {/* Account */}
        <button style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', padding: 0 }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke={C.ivory} strokeWidth="1.25" strokeLinecap="round" style={{ opacity: 0.8 }}>
            <circle cx="9" cy="6.5" r="3" /><path d="M2.5 17c0-3.5 2.9-6.5 6.5-6.5s6.5 3 6.5 6.5" />
          </svg>
        </button>
        {/* Cart */}
        <button style={{ background: 'none', border: 'none', cursor: 'pointer', display: 'flex', padding: 0, position: 'relative' }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke={C.ivory} strokeWidth="1.25" strokeLinecap="round" style={{ opacity: 0.8 }}>
            <path d="M1.5 1.5h2.3l2.2 9.2a1 1 0 00.97.8h7.5a1 1 0 00.97-.76L17 6H4.5" />
            <circle cx="7.5" cy="14.5" r="1.2" fill={C.ivory} stroke="none" style={{ opacity: 0.8 }} />
            <circle cx="13.5" cy="14.5" r="1.2" fill={C.ivory} stroke="none" style={{ opacity: 0.8 }} />
          </svg>
          <span style={{ position: 'absolute', top: -5, right: -6, background: C.copper, color: C.ivory, fontSize: 8, fontFamily: F.ui, fontWeight: 500, width: 14, height: 14, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>1</span>
        </button>
      </div>
    </nav>
  );
}

/* ══════════════════════════════════════
   SECTION 1 — BREADCRUMB
══════════════════════════════════════ */
function Breadcrumb() {
  return (
    <div style={{
      background: C.ivory,
      padding: `20px ${PAD} 16px`,
      display: 'flex', alignItems: 'center', gap: 0,
    }}>
      {[
        { label: 'Sarees', link: true },
        { label: ' / ', sep: true },
        { label: 'Benarasi', link: true },
        { label: ' / ', sep: true },
        { label: 'Royal Crimson Benarasi', current: true },
      ].map((item, i) => {
        if (item.sep) return (
          <span key={i} style={{ fontFamily: F.ui, fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.16em', color: `rgba(140,106,85,0.5)`, margin: '0 4px' }}>{item.label}</span>
        );
        if (item.link) return (
          <span key={i} style={{
            fontFamily: F.ui, fontSize: 11, textTransform: 'uppercase',
            letterSpacing: '0.16em', fontWeight: 400,
            color: C.muted,
            borderBottom: `1px solid rgba(140,106,85,0.3)`,
            cursor: 'pointer',
          }}>{item.label}</span>
        );
        return (
          <span key={i} style={{
            fontFamily: F.ui, fontSize: 11, textTransform: 'uppercase',
            letterSpacing: '0.16em', fontWeight: 400,
            color: `rgba(28,10,6,0.70)`,
          }}>{item.label}</span>
        );
      })}
    </div>
  );
}

/* ══════════════════════════════════════
   SECTION 2 — PRODUCT HERO
══════════════════════════════════════ */

/* Left: Gallery — 4 stacked portrait images */
function Gallery() {
  const images = [
    {
      gradient: 'linear-gradient(155deg, #2A0D06, #6B2E0E 35%, #BF5E18 70%, #8B3A14)',
      label: 'SAREE PHOTOGRAPHY — FULL DRAPE ON MODEL · ELEGANT POSE WITH VARANASI-STYLE PILLAR BACKDROP',
    },
    {
      gradient: 'linear-gradient(155deg, #1C0A06, #4A2010 50%, #BF5E18)',
      label: 'SAREE PHOTOGRAPHY — FLAT LAY · FULL SAREE LAYOUT SHOWING BORDER',
    },
    {
      gradient: 'linear-gradient(155deg, #3D1C0A, #8B3A14 50%, #D4880A)',
      label: 'SAREE PHOTOGRAPHY — PALLU CLOSEUP · GOLD ZARI WORK DETAIL',
    },
    {
      gradient: 'linear-gradient(155deg, #2A1008, #5A2A14 50%, #BF5E18)',
      label: 'SAREE PHOTOGRAPHY — FABRIC TEXTURE MACRO · KADWA JANGLA WEAVE DETAIL',
    },
  ];
  return (
    <div style={{ flex: '0 0 60%', display: 'flex', flexDirection: 'column', gap: 12, position: 'relative' }}>
      {images.map((img, i) => (
        <PhotoPlaceholder key={i} gradient={img.gradient} label={img.label} aspect="3/4" />
      ))}
      {/* Lightbox annotation */}
      <div style={{
        position: 'absolute', left: -220, top: 60,
        width: 200,
        fontFamily: F.ui, fontSize: 9,
        color: 'rgba(212,136,10,0.65)',
        lineHeight: 1.55,
        borderRight: '1px solid rgba(212,136,10,0.25)',
        paddingRight: 8,
        textAlign: 'right',
      }}>↗ Click any image to open full-screen lightbox with pan &amp; pinch. Lightbox bg: brand-dark at 92% opacity. Dismiss on Esc or click outside.</div>
    </div>
  );
}

/* Right: Info Panel — Groups A–E */
function AccordionRow({ title, expanded, children }) {
  const [open, setOpen] = useState(expanded || false);
  return (
    <div>
      <div
        onClick={() => setOpen(o => !o)}
        style={{
          height: 56, display: 'flex', alignItems: 'center',
          justifyContent: 'space-between', cursor: 'pointer',
          borderBottom: `1px solid rgba(140,106,85,0.25)`,
        }}>
        <span style={{ fontFamily: F.ui, fontSize: 12, fontWeight: 500, letterSpacing: '0.18em', textTransform: 'uppercase', color: C.dark }}>{title}</span>
        <span style={{ fontFamily: F.ui, fontSize: 16, color: C.muted, lineHeight: 1, width: 16, textAlign: 'center', transition: 'transform 0.2s', transform: open ? 'rotate(45deg)' : 'none' }}>+</span>
      </div>
      {open && (
        <div style={{ padding: '24px 0 24px', borderBottom: `1px solid rgba(140,106,85,0.25)` }}>
          {children}
        </div>
      )}
    </div>
  );
}

function BulletList({ items }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {items.map((item, i) => (
        <div key={i} style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
          <span style={{ color: C.copper, fontSize: 10, flexShrink: 0 }}>•</span>
          <span style={{ fontFamily: F.ui, fontSize: 13, fontWeight: 300, color: `rgba(28,10,6,0.80)`, lineHeight: 1.7 }}>{item}</span>
        </div>
      ))}
    </div>
  );
}

function InfoPanel() {
  const [pincode, setPincode] = useState('');
  const [wishlist, setWishlist] = useState(false);

  return (
    <div style={{ flex: '0 0 40%', position: 'relative' }}>

      {/* ── GROUP A — IDENTITY ── */}
      <div style={{ marginBottom: 32 }}>
        {/* Eyebrow tag */}
        <div style={{ fontFamily: F.ui, fontSize: 10, fontWeight: 400, letterSpacing: '0.24em', textTransform: 'uppercase', color: C.copper, marginBottom: 16 }}>
          BENARASI · BENGALI HERITAGE WEAVE
        </div>
        {/* Product name */}
        <h1 style={{ fontFamily: F.display, fontSize: 36, fontWeight: 300, color: C.dark, lineHeight: 1.15, letterSpacing: '-0.01em', marginBottom: 8 }}>
          Royal Crimson Benarasi
        </h1>
        {/* Sub-meta */}
        <div style={{ fontFamily: F.ui, fontSize: 12, fontWeight: 400, letterSpacing: '0.18em', textTransform: 'uppercase', color: C.muted }}>
          Pure Silk · Handwoven · Varanasi
        </div>
      </div>

      {/* ── GROUP B — PRICE + STOCK ── */}
      <div style={{ marginBottom: 32 }}>
        {/* Price row */}
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 8 }}>
          <span style={{ fontFamily: F.display, fontSize: 28, fontWeight: 500, color: C.copper, letterSpacing: '-0.005em' }}>₹24,500</span>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            {/* Copper diamond glyph */}
            <svg width="8" height="8" viewBox="0 0 8 8">
              <rect x="1" y="1" width="6" height="6" fill={C.copper} transform="rotate(45,4,4)" />
            </svg>
            <span style={{ fontFamily: F.ui, fontSize: 11, fontWeight: 500, letterSpacing: '0.16em', textTransform: 'uppercase', color: C.gold }}>Only 1 piece — one of one</span>
          </div>
        </div>
        {/* Tax note */}
        <div style={{ fontFamily: F.ui, fontSize: 11, fontWeight: 300, color: C.muted, lineHeight: 1.5 }}>
          Inclusive of all taxes · MRP
        </div>
      </div>

      {/* ── GROUP C — CTA CLUSTER ── */}
      <div style={{ marginBottom: 32, position: 'relative' }}>
        {/* Primary row */}
        <div style={{ display: 'flex', gap: 12, marginBottom: 12 }}>
          {/* Add to Bag */}
          <button
            style={{
              flex: 1, height: 52,
              background: C.dark, color: C.ivory,
              border: 'none', borderRadius: 0,
              fontFamily: F.ui, fontSize: 11, fontWeight: 500,
              letterSpacing: '0.18em', textTransform: 'uppercase',
              cursor: 'pointer', transition: 'background 0.4s ease-out, letter-spacing 0.4s ease-out',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = C.copper; e.currentTarget.style.letterSpacing = '0.22em'; }}
            onMouseLeave={e => { e.currentTarget.style.background = C.dark; e.currentTarget.style.letterSpacing = '0.18em'; }}
          >
            Add to Bag
          </button>
          {/* Wishlist */}
          <button
            onClick={() => setWishlist(w => !w)}
            style={{
              width: 52, height: 52, flexShrink: 0,
              background: 'transparent',
              border: `1px solid rgba(140,106,85,${wishlist ? '1' : '0.40'})`,
              borderColor: wishlist ? C.copper : 'rgba(140,106,85,0.40)',
              borderRadius: 0, cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              transition: 'border-color 0.2s',
            }}
            onMouseEnter={e => { if (!wishlist) e.currentTarget.style.borderColor = C.copper; }}
            onMouseLeave={e => { if (!wishlist) e.currentTarget.style.borderColor = 'rgba(140,106,85,0.40)'; }}
          >
            <svg width="20" height="20" viewBox="0 0 20 20" fill={wishlist ? C.copper : 'none'} stroke={wishlist ? C.copper : C.dark} strokeWidth="1.5">
              <path d="M10 17.5S2.5 12.5 2.5 7A4 4 0 0110 3.85 4 4 0 0117.5 7c0 5.5-7.5 10.5-7.5 10.5z" />
            </svg>
          </button>
        </div>

        {/* Hover annotation */}
        <Note text="Hover: bg → copper, letter-spacing → 0.22em over 0.4s ease-out. Wishlist hover: border → copper, heart fills copper." top={0} />

        {/* WhatsApp */}
        <button
          style={{
            width: '100%', height: 52,
            background: C.whatsapp, color: '#FFFFFF',
            border: 'none', borderRadius: 0,
            fontFamily: F.ui, fontSize: 12, fontWeight: 500,
            letterSpacing: '0.18em', textTransform: 'uppercase',
            cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            gap: 12, marginBottom: 16,
          }}
        >
          {/* WhatsApp icon */}
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/>
            <path d="M11.998 2.003C6.476 2.003 2 6.479 2 12.001c0 1.762.457 3.45 1.33 4.931L2 22l5.218-1.299A9.955 9.955 0 0012 21.999c5.522 0 9.998-4.476 9.998-9.998 0-5.523-4.476-9.998-9.998-9.998zm0 18.286a8.27 8.27 0 01-4.208-1.154l-.303-.18-3.098.772.794-3.001-.198-.311A8.265 8.265 0 013.73 12c0-4.568 3.714-8.282 8.268-8.282 4.555 0 8.267 3.714 8.267 8.282 0 4.567-3.712 8.289-8.267 8.289z"/>
          </svg>
          Chat on WhatsApp
        </button>

        {/* WhatsApp annotation */}
        <Note text="Tapping prefills: 'Hi Sumam, I'm interested in the Royal Crimson Benarasi (₹24,500). Could you share more details?'" top={76} />

        {/* Pincode */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 0 }}>
          <input
            type="text"
            placeholder="Enter pincode for delivery"
            value={pincode}
            onChange={e => setPincode(e.target.value)}
            style={{
              flex: 1, height: 40,
              background: 'none', border: 'none',
              borderBottom: `1px solid rgba(140,106,85,0.30)`,
              outline: 'none',
              fontFamily: F.ui, fontSize: 12, color: C.dark,
              paddingLeft: 0,
            }}
          />
          <button style={{
            height: 40, padding: '0 20px', flexShrink: 0,
            background: 'none', borderRadius: 0,
            border: `1px solid ${C.copper}`,
            color: C.copper,
            fontFamily: F.ui, fontSize: 10,
            fontWeight: 500, letterSpacing: '0.18em',
            textTransform: 'uppercase', cursor: 'pointer',
          }}>CHECK</button>
        </div>
      </div>

      {/* ── GROUP D — DESCRIPTION ── */}
      <div style={{ marginBottom: 32 }}>
        <div style={{ fontFamily: F.display, fontSize: 18, fontWeight: 400, color: C.dark, marginBottom: 16, lineHeight: 1.2 }}>
          About This Saree
        </div>
        <div style={{ width: 24, height: 1, background: C.copper, marginBottom: 16 }} />
        <p style={{ fontFamily: F.ui, fontSize: 13, fontWeight: 300, color: 'rgba(28,10,6,0.80)', lineHeight: 1.8 }}>
          A regal Benarasi handwoven in the Kadwa Jangla technique, where each motif is woven separately into the fabric — never stitched on. The crimson silk is hand-dyed using traditional methods, with intricate 24-carat gold zari work across the pallu and border. Sourced directly from a fourth-generation weaving family in Varanasi.
        </p>
      </div>

      {/* ── GROUP E — ACCORDION ── */}
      <div>
        <AccordionRow title="Fabric & Weave" expanded={true}>
          <BulletList items={['Pure Mulberry Silk', 'Banarasi Kadwa Jangla weave', '24-carat gold zari work']} />
        </AccordionRow>
        <AccordionRow title="Occasion" expanded={false}>
          <BulletList items={['Wedding', 'Reception', 'Puja', 'Festive']} />
        </AccordionRow>
        <AccordionRow title="Dimensions" expanded={false}>
          <BulletList items={['6.5m saree length', '0.8m blouse piece', '110 cm width']} />
        </AccordionRow>
        <AccordionRow title="Care" expanded={false}>
          <BulletList items={['Dry clean only', 'Store wrapped in muslin cloth', 'Avoid direct sunlight', 'Do not iron directly on zari']} />
        </AccordionRow>
        <AccordionRow title="Shipping & Returns" expanded={false}>
